name: planulix
description: "Planulix — desktop & mobile client for Kimi Code & Claude Code sessions + Go gateway (repo: Planulix)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  provider: ^6.1.5+1
  intl: ^0.20.2
  shared_preferences: ^2.2.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  archive: ^3.6.1
  crypto: ^3.0.6
  file_picker: ^8.1.2
  flutter_highlight: ^0.7.0
  web_socket_channel: ^2.4.0
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - scripts/install_gateway_remote.sh
