name: Gateway Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: gateway-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-send:
    name: Build and send Linux gateways
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Telegram configuration
        env:
          PLANULIX_TELEGRAM_BOT_TOKEN: ${{ secrets.PLANULIX_TELEGRAM_BOT_TOKEN }}
          PLANULIX_TELEGRAM_CHAT_ID: ${{ secrets.PLANULIX_TELEGRAM_CHAT_ID }}
        run: |
          : "${PLANULIX_TELEGRAM_BOT_TOKEN:?missing PLANULIX_TELEGRAM_BOT_TOKEN Actions secret}"
          : "${PLANULIX_TELEGRAM_CHAT_ID:?missing PLANULIX_TELEGRAM_CHAT_ID Actions secret}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build and package
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd server && GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" \
              -o "../dist/planulix-gateway-linux-$arch" .)
            mkdir -p "dist/pkg-$arch"
            cp "dist/planulix-gateway-linux-$arch" "dist/pkg-$arch/planulix-gateway"
            chmod +x "dist/pkg-$arch/planulix-gateway"
            tar -C "dist/pkg-$arch" -czf "dist/planulix-gateway-linux-$arch.tar.gz" planulix-gateway
            (cd dist && shasum -a 256 "planulix-gateway-linux-$arch.tar.gz" \
              > "planulix-gateway-linux-$arch.tar.gz.sha256")
          done

      - name: Send builds to Telegram admin channel
        env:
          PLANULIX_TELEGRAM_BOT_TOKEN: ${{ secrets.PLANULIX_TELEGRAM_BOT_TOKEN }}
          PLANULIX_TELEGRAM_CHAT_ID: ${{ secrets.PLANULIX_TELEGRAM_CHAT_ID }}
        run: |
          for archive in dist/planulix-gateway-linux-*.tar.gz; do
            bash scripts/send_gateway_to_telegram.sh "$archive"
          done
